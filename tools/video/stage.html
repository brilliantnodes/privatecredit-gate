<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: InterV; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: InterV; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: InterV; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: InterV; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2); font-weight: 800; }
html, body { margin: 0; background: #143d33; }
#s { position: relative; overflow: hidden; background: #143d33; color: #fff; font-family: InterV, Inter, sans-serif; }
#veil { position: absolute; inset: 0; background: #143d33; pointer-events: none; }
.top { position: absolute; left: calc(var(--u) * 28); right: calc(var(--u) * 28); top: calc(var(--u) * 22); display: flex; justify-content: space-between; font-size: calc(var(--u) * 20); color: #c5d6cf; }
.top b { color: #fff; font-weight: 700; }
.cap { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 50); width: max-content; max-width: 86%; background: rgba(6,20,16,.93); color: #fff; font-weight: 600; font-size: calc(var(--u) * 32); line-height: 1.28; padding: calc(var(--u) * 14) calc(var(--u) * 26); border-radius: calc(var(--u) * 8); text-align: center; }
.c { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
.h1 { font-weight: 800; font-size: calc(var(--u) * 80); line-height: 1.12; text-align: center; }
.gd { color: #e8b94a; }
.rd { color: #ff6b5e; }
.gn { color: #5fd69a; }
.sub { color: #c5d6cf; font-size: calc(var(--u) * 34); margin-top: calc(var(--u) * 22); text-align: center; line-height: 1.35; }
.box { background: #1d5244; border: calc(var(--u) * 2) solid #2f6b5b; border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 18) calc(var(--u) * 26); text-align: center; min-width: calc(var(--u) * 240); }
.box b { display: block; font-size: calc(var(--u) * 32); }
.box span { display: block; font-size: calc(var(--u) * 20); color: #b6cbc3; margin-top: calc(var(--u) * 4); }
.box .amt { font-size: calc(var(--u) * 52); font-weight: 800; color: #e8b94a; margin-top: calc(var(--u) * 12); white-space: nowrap; }
.box.hl { border-color: #e8b94a; box-shadow: 0 0 0 calc(var(--u) * 3) rgba(232,185,74,.25); }
.coin { position: absolute; width: calc(var(--u) * 56); height: calc(var(--u) * 56); border-radius: 50%; background: #e8b94a; color: #143d33; font-weight: 800; font-size: calc(var(--u) * 19); display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); }
.card { background: #fff; color: #17201d; border-radius: calc(var(--u) * 10); overflow: hidden; box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 40) rgba(0,0,0,.35); }
.card .ch { background: #22302b; color: #fff; padding: calc(var(--u) * 12) calc(var(--u) * 20); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: calc(var(--u) * 24); }
.tag { background: #ffcc00; color: #000; font-size: calc(var(--u) * 14); font-weight: 800; padding: calc(var(--u) * 3) calc(var(--u) * 9); border-radius: calc(var(--u) * 4); }
.card .cs { color: #5c6863; font-size: calc(var(--u) * 18); padding: calc(var(--u) * 10) calc(var(--u) * 20) 0; }
.card table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.card td { padding: calc(var(--u) * 9) calc(var(--u) * 20); border-top: 1px solid #e3e5e8; font-size: calc(var(--u) * 23); }
.card td:last-child { text-align: right; font-weight: 700; }
.vals { display: flex; gap: calc(var(--u) * 34); }
.v { width: calc(var(--u) * 70); height: calc(var(--u) * 70); border-radius: 50%; border: calc(var(--u) * 3) solid #2f6b5b; background: #1d5244; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: calc(var(--u) * 22); color: #b6cbc3; }
.v.ok { background: #1d9a5f; border-color: #1d9a5f; color: #fff; font-size: calc(var(--u) * 38); }
.v.no { background: #6b2a24; border-color: #a5463b; color: #fff; font-size: calc(var(--u) * 34); }
.vnote { color: #b6cbc3; font-size: calc(var(--u) * 22); margin-top: calc(var(--u) * 12); white-space: nowrap; }
.calc { margin-top: calc(var(--u) * 30); font-size: calc(var(--u) * 34); white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.calc small { display: block; font-size: calc(var(--u) * 20); color: #b6cbc3; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: calc(var(--u) * 8); }
.badge { display: inline-block; font-weight: 800; font-size: calc(var(--u) * 26); padding: calc(var(--u) * 8) calc(var(--u) * 18); border-radius: calc(var(--u) * 6); letter-spacing: .03em; }
.badge.red { background: #c2412f; color: #fff; }
.badge.green { background: #1d9a5f; color: #fff; }
.badge.gold { background: #e8b94a; color: #143d33; }
.badge.grey { background: #3c4f49; color: #fff; }
.trio { display: flex; gap: calc(var(--u) * 26); }
.panel { width: calc(var(--u) * 330); background: #1d5244; border: calc(var(--u) * 2) solid #2f6b5b; border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 20) calc(var(--u) * 22); min-height: calc(var(--u) * 300); }
.panel h4 { margin: 0; font-size: calc(var(--u) * 25); }
.panel .who { font-size: calc(var(--u) * 17); color: #b6cbc3; margin-top: calc(var(--u) * 4); }
.panel .big { font-size: calc(var(--u) * 40); font-weight: 800; margin-top: calc(var(--u) * 18); font-variant-numeric: tabular-nums; }
.panel .ln { font-size: calc(var(--u) * 20); color: #e3ece8; margin-top: calc(var(--u) * 12); line-height: 1.35; }
.grid { border-collapse: collapse; font-size: calc(var(--u) * 24); }
.grid th { color: #b6cbc3; font-weight: 600; font-size: calc(var(--u) * 18); text-transform: uppercase; letter-spacing: .05em; text-align: left; padding: calc(var(--u) * 8) calc(var(--u) * 18); }
.grid td { padding: calc(var(--u) * 11) calc(var(--u) * 18); border-top: 1px solid #2f6b5b; }
.grid td.t { text-align: center; color: #5fd69a; font-weight: 800; font-size: calc(var(--u) * 28); }
.grid td.e { color: #e8b94a; font-weight: 600; }
.foot { margin-top: calc(var(--u) * 22); font-size: calc(var(--u) * 26); color: #e3ece8; text-align: center; }
.foot b { color: #e8b94a; }
.browser { background: #fff; border-radius: calc(var(--u) * 12); overflow: hidden; box-shadow: 0 calc(var(--u) * 14) calc(var(--u) * 50) rgba(0,0,0,.4); }
.browser .bb { background: #e9ecf1; height: calc(var(--u) * 40); display: flex; align-items: center; gap: calc(var(--u) * 8); padding: 0 calc(var(--u) * 14); color: #4b5563; font-size: calc(var(--u) * 18); }
.browser .bb i { width: calc(var(--u) * 13); height: calc(var(--u) * 13); border-radius: 50%; background: #e5484d; display: inline-block; }
.browser .bb i:nth-child(2) { background: #f5b301; } .browser .bb i:nth-child(3) { background: #2fb36b; }
.browser .bb span { flex: 1; text-align: center; margin-right: calc(var(--u) * 50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.browser .shot { overflow: hidden; position: relative; background: #f6f5f0; }
.browser img { position: absolute; left: 0; width: 100%; }
.end b { font-size: calc(var(--u) * 90); font-weight: 800; }
.end .t { font-size: calc(var(--u) * 34); margin-top: calc(var(--u) * 8); color: #e3ece8; }
.end .url { color: #e8b94a; font-size: calc(var(--u) * 34); font-weight: 600; margin-top: calc(var(--u) * 44); }
.end .gh { color: #c5d6cf; font-size: calc(var(--u) * 24); margin-top: calc(var(--u) * 12); }
.end .f { position: absolute; bottom: calc(var(--u) * 44); font-size: calc(var(--u) * 20); color: #b6cbc3; }
</style></head>
<body><div id="s"></div>
<script>
const S = document.getElementById("s");
let D = null, W = 1920, H = 1080, U = 1;
function setup(w, h, data) {
  W = w; H = h; D = data;
  U = h / 820;
  S.style.width = w + "px"; S.style.height = h + "px";
  S.style.setProperty("--u", U + "px");
}
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const px = (n) => (n * U) + "px";
const op = (t, a, b) => `opacity:${seg(t, a, b)}`;
const topbar = () => `<div class="top"><b>PrivateCreditGate</b><span>Intelligent Contract on GenLayer · fictional companies</span></div>`;
const cap = (text, t, dur) => `<div class="cap" style="opacity:${seg(t, .15, .55) * (1 - seg(t, dur - .3, dur))}">${text}</div>`;
const at = (x, y, inner) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%)">${inner}</div>`;

const SCENES = {
  hook(t, dur) {
    return `<div class="c" style="top:${px(190)}"><div class="h1">Leverage must stay<br>below <span class="gd">3.50x</span>.</div>
      <div class="sub" style="${op(t, 1.3, 1.9)}">Today a lender checks the borrower's figures by hand,<br>weeks after the quarter ends.</div>
      <div class="sub" style="${op(t, 2.6, 3.2)};color:#fff;font-weight:700;font-size:${px(40)};margin-top:${px(36)}">What if the loan checked itself?</div></div>`;
  },
  report(t, dur) {
    const w = 1000 * U, h = 540 * U, zoom = 1.3;
    const y = lerp(-0.04, -0.10, seg(t, 1.0, 4.6));
    return `<div class="c" style="top:${px(70)}"><div class="browser" style="width:${w}px"><div class="bb"><i></i><i></i><i></i><span>privatecredit.brilliantnodes.com/reports/brenthollow/bradbury-1/period-1.html</span></div>
      <div class="shot" style="height:${h}px"><img src="${D.report}" style="width:${zoom * 100}%;left:${-(zoom - 1) * 50}%;top:${y * w * zoom * D.report_ratio}px"></div></div></div>` +
      cap("Each borrower publishes its figures on a web page (demo pages).", t, dur);
  },
  validators(t, dur) {
    const b = D.brenthollow;
    const rows = b.rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
    const card = `<div class="card" style="width:${px(470)}"><div class="ch"><span>${b.company}</span><span class="tag">FICTIONAL</span></div><div class="cs">Period ${b.period} · EUR thousands</div><table>${rows}</table></div>`;
    const v = b.votes.map((vote, i) => {
      const on = t > .9 + i * .45;
      const cls = on ? (vote === "agree" ? "ok" : "no") : "";
      return `<div class="v ${cls}">${on ? (vote === "agree" ? "✓" : "✗") : "V" + (i + 1)}</div>`;
    }).join("");
    const nAgree = b.votes.filter((x) => x === "agree").length;
    const left = `<div style="position:absolute;left:${W * .27}px;top:${H * .42}px;transform:translate(-50%,-50%)">${card}</div>`;
    const right = `<div style="position:absolute;left:${W * .68}px;top:${H * .40}px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center">
      <div class="vals">${v}</div>
      <div class="vnote" style="${op(t, 2.8, 3.2)}">${nAgree} of ${b.votes.length} validators copied the same four figures</div>
      <div class="calc" style="${op(t, 3.4, 3.9)}"><small>Code, not a model</small>net debt ${b.net_debt_m}m ÷ EBITDA ${b.ebitda_m}m = <span class="rd">${b.leverage}</span></div>
      <div style="margin-top:${px(26)};${op(t, 4.3, 4.7)}"><span class="badge red">BREACH · limit ${b.limit}</span></div></div>`;
    return left + right + cap("Validators copy the figures exactly. Code computes the covenants.", t, dur);
  },
  cure(t, dur) {
    const b = D.brenthollow;
    const k = seg(t, 1.6, 3.0);
    const bx = W * .22, cx = W * .62, y = H * .40;
    const lev = k >= 1 ? b.after_cure : b.leverage;
    let html = at(bx, y, `<div class="box"><b>Borrower</b><span>equity cure in time</span></div>`);
    html += at(cx, y, `<div class="box ${t > 1.4 && t < 3.4 ? "hl" : ""}" style="min-width:${px(420)}"><b>Facility #${b.facility}</b>
      <span>quote: prepay EUR ${b.cure_m}m of principal</span>
      <div class="amt"><em class="${k >= 1 ? "gn" : "rd"}" style="font-style:normal">${lev}</em></div>
      <div style="margin-top:${px(14)}"><span class="badge ${k >= 1 ? "green" : "red"}">${k >= 1 ? "CURED · ACTIVE" : "BREACH"}</span></div></div>`);
    if (k > 0 && k < 1) html += `<div class="coin" style="left:${lerp(bx, cx, k)}px;top:${y}px">€${b.cure_m}m</div>`;
    html += `<div class="c" style="top:${px(500)};${op(t, 3.6, 4.1)}"><div class="sub" style="margin:0;font-size:${px(26)}">Too little is refunded at once. Too much comes back as surplus.</div></div>`;
    return html + cap("The exact cure is quoted on chain. Paid in time, it prepays principal.", t, dur);
  },
  outcomes(t, dur) {
    const q = D.quillstrand, n = D.oskendale;
    const p1 = `<div class="panel" style="${op(t, .2, .7)}"><h4>Margin grid</h4><div class="who">${q.company}</div>
      <div class="big">${q.before} → <span class="gd">${q.after}</span></div>
      <div class="ln">Margin ${q.m_before} → <b class="gd">${q.m_after}</b> from the window close</div>
      <div class="ln">Read from prose: no table on the page</div></div>`;
    const p2 = `<div class="panel" style="${op(t, 1.6, 2.1)}"><h4>Event of default</h4><div class="who">${n.company}</div>
      <div class="big">cover <span class="rd">${n.cover}</span></div>
      <div class="ln">Below ${n.min_cover}: cash cannot cure cover</div>
      <div class="ln">Default → acceleration → DSRA applied → write-off</div></div>`;
    const p3 = `<div class="panel" style="${op(t, 3.0, 3.5)}"><h4>No reading</h4><div class="who">${D.tarrowmere.company}</div>
      <div class="big"><span class="gd">units missing</span></div>
      <div class="ln">Not published, then published without units</div>
      <div class="ln">Window closes unread → default → lender waives</div></div>`;
    return `<div class="c" style="top:${px(120)}"><div class="trio">${p1}${p2}${p3}</div></div>` +
      cap("Pricing, defaults and waivers follow written rules, on set dates.", t, dur);
  },
  networks(t, dur) {
    const rows = D.cases.map((c, i) => `<tr style="${op(t, .3 + i * .3, .7 + i * .3)}"><td><b>${c[0]}</b></td><td>${c[1]}</td><td class="e">${c[2]}</td><td class="t">✓</td><td class="t">✓</td></tr>`).join("");
    return `<div class="c" style="top:${px(96)}"><table class="grid"><tr><th>Borrower</th><th>Story</th><th>End</th><th>Studio</th><th>Bradbury</th></tr>${rows}</table>
      <div class="foot" style="${op(t, 2.2, 2.7)}"><b>${D.tx_studio + D.tx_bradbury}</b> transactions · identical readings on both networks · real test GEN on Bradbury</div></div>` +
      cap("Five fictional borrowers, run end to end on Studio and on the Bradbury testnet.", t, dur);
  },
  site(t, dur) {
    const w = 1080 * U, h = 600 * U;
    const y = -lerp(0.0, 0.29, seg(t, 0.9, dur - 1.4)) * w * D.shot_ratio;
    return `<div class="c" style="top:${px(58)}"><div class="browser" style="width:${w}px"><div class="bb"><i></i><i></i><i></i><span>privatecredit.brilliantnodes.com/?net=bradbury&amp;id=3</span></div>
      <div class="shot" style="height:${h}px"><img src="${D.shot}" style="top:${y}px"></div></div></div>` +
      cap("Every reading and transaction is on the site. Try your own on Studio.", t, dur);
  },
  end(t, dur) {
    return `<div class="c end" style="top:${px(210)}"><b style="${op(t, .1, .6)}">PrivateCreditGate</b><div class="t" style="${op(t, .4, .9)}">Covenant-gated credit on GenLayer</div>
      <div class="url" style="${op(t, .8, 1.3)}">privatecredit.brilliantnodes.com</div><div class="gh" style="${op(t, .9, 1.4)}">github.com/brilliantnodes/privatecredit-gate</div></div>
      <div class="c end" style="top:0;bottom:0"><div class="f">Fictional companies; demo data on test networks. Not an offer of credit.</div></div>`;
  },
};

function draw(name, t, dur, fadeIn, fadeOut) {
  const body = SCENES[name](t, dur);
  const veil = Math.max(fadeIn ? 1 - clamp(t / .35) : 0, fadeOut ? clamp((t - (dur - .35)) / .35) : 0);
  S.innerHTML = (name === "end" ? "" : topbar()) + body + `<div id="veil" style="opacity:${veil}"></div>`;
  return Promise.all([...S.querySelectorAll("img")].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
}
</script></body></html>
